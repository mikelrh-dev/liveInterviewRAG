[project]
name = "interviewtts"
version = "0.1.0"
description = "AI-powered voice interview digital twin"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "faster-whisper>=0.10.0",
    "edge-tts>=6.1.0",
    "sentence-transformers>=2.2.0",
    "pydub>=0.25.1",
    "numpy>=1.24.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
