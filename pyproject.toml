[build-system]
# Present because the `dev` extra below has to be installable at all:
# `pip install -e ".[dev]"` is how CI installs the test runner, so that what CI
# uses is what the project declares. Without this table, pip falls back to
# setuptools defaults, and setuptools' flat-layout auto-discovery ABORTS on this
# repository -- it finds 14 top-level directories (data, wiki, audio, nginx,
# avatar, RAGraw, backend, reports, frontend, openspec, wikiDocs, auditoria,
# candidate, deployment) and refuses to guess which are packages. The declared
# dev extra was, as a direct consequence, uninstallable.
#
# The count is what a clean checkout sees, which is what CI and a fresh clone
# get. setuptools' flat-layout finder also counts gitignored local artifacts,
# so this working tree detects 15 once node_modules/ exists -- which is why
# the number here is not the number you would get from `ls`.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicit, because the layout is flat and the auto-discovery above is not usable.
# `backend` is the only importable package in the repository: `tests` is never
# installed (it is collected from the checkout by pytest, not imported from
# site-packages) and the rest are data or tooling directories.
include = ["backend", "backend.*"]

[project]
name = "interviewtts"
version = "0.1.0"
description = "AI-powered voice interview digital twin"
requires-python = ">=3.10"
# MUST stay identical to backend/requirements.txt, entry for entry. Two
# manifests describing one install drift silently and for free: they already
# had (python-dotenv was missing here entirely, httpx sat at two different
# floors). tests/test_packaging.py::TestManifestsDoNotDrift fails on any
# difference in distribution set, version floor or extras.
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "faster-whisper>=0.10.0",
    "edge-tts>=6.1.0",
    "sentence-transformers>=2.2.0",
    "pydub>=0.25.1",
    "numpy>=1.24.0",
    "python-multipart>=0.0.6",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    # Imported directly by backend/, previously declared nowhere. Each floor is
    # the exact floor an already-mandatory dependency imposes. See
    # backend/requirements.txt for the per-dependency reasoning.
    "pyyaml>=6.0",        # backend/services/rag.py:14
    "scikit-learn>=1.1.0",  # backend/services/rag.py:677, TF-IDF fallback
    "starlette>=0.46.0",  # backend/middleware.py:13
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    # Aligned with the runtime floor above, which was already the stricter of
    # the two. Tests exercise the real httpx-backed TestClient, so a dev
    # environment resolved to 0.25.x would be running an httpx the app itself
    # has already declared it does not support.
    "httpx>=0.28.0",
    # tomllib is stdlib from 3.11. tests/test_packaging.py reads this file, and
    # this project supports 3.10, where it needs a backport.
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
