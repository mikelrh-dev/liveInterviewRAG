name: tests

# What this workflow guarantees, and what it does not.
#
# GUARANTEES: that both test suites run on every push and pull request, and
# that a real failure in either is reported as a failure. It runs the exact
# commands that are canonical locally, so a green run here means a green run
# on a developer machine.
#
# It also guarantees the dependency manifests stay honest, which it could not
# do before: tests/test_packaging.py fails the build if backend/ imports a
# distribution that neither backend/requirements.txt nor pyproject.toml
# declares, or if those two files disagree on any distribution or floor. That
# test is why the "install the undeclared packages by hand" step is gone, and
# why it cannot be reintroduced quietly -- a hand-written pip line is not a
# declaration, and adding one here is what hid this class of bug. The remaining
# hand-written line was the dev extra itself, which is now installed from the
# declaration instead; see that step for what was wrong with it.
#
# WHAT CI DOES NOT ESTABLISH
# --------------------------
# It does not check that the owner's personal content is correct, and it cannot.
# The real `wiki/` is private, is not in this repository, and is not this
# project's business. The retrieval corpus the suite measures is
# `tests/fixtures/retrieval_corpus/` -- 42 entirely invented pages, committed in
# full, `index.md` included. That substitution is what makes the suite
# portable, and it is why this job no longer needs a wiki at all: on a checkout
# with `wiki/` deleted, pytest gives 592 passed / 2 skipped / 2 xfailed, where
# the 2 skips are the "nothing to compare against the real wiki" checks in
# `tests/fixture_corpus.py`. A green run here therefore means the CODE is
# sound against a corpus anyone can clone. It means nothing about whether the
# owner's answers are good answers, and no result in this file should be read
# as if it did.
#
# THE ONE KNOWN FAILURE ON THIS PLATFORM
# --------------------------------------
# `tests/test_config.py::test_config_paths` asserts that the checkout directory
# is named "InterviewTTS". It is not, and has not been for a while:
# `actions/checkout` names the workspace after the REPOSITORY, and the remote
# is `mikelrh-dev/liveInterviewRAG`, so `cfg.BASE_DIR.name` is "liveInterviewRAG"
# and that assertion fails. This is reproduced here, not predicted: cloning this
# repository to any other directory name fails it, which is how it was found.
#
# It is reported rather than fixed, because the fix is an ownership decision,
# not a CI change. Either the repository is renamed to InterviewTTS, or the
# assertion is narrowed to what is actually a property of the code (that
# BASE_DIR is the repository root, and that CANDIDATE_DIR / AUDIO_DIR /
# FRONTEND_DIR sit inside it -- the other three assertions in the same test).
# Whichever is chosen, do not silence it with a skip or an xfail: a test that
# encodes a real constraint should be corrected, not muted.
#
# TWO ENVIRONMENT TRAPS THIS REPRODUCES ON PURPOSE
# ------------------------------------------------
# 1. `PYTEST_DISABLE_PLUGIN_AUTOLOAD` is NOT set. With it set, pytest-asyncio
#    is never auto-loaded and 8 async tests fail with a misleading
#    "async def functions are not natively supported" error. There is no
#    `-p no:cacheprovider`-style fix; the variable simply must stay unset, so
#    it is called out here rather than left to be re-introduced.
# 2. The interpreter is the one `actions/setup-python` provisioned, and it is
#    the one that received the dependencies below. Running `pytest` from a
#    different interpreter — a system python, a sibling venv — produces
#    "No module named pydantic" and looks like a dependency bug.
#
# MODEL DOWNLOAD
# --------------
# The RAG embeds with `all-MiniLM-L6-v2` (~90 MB) and downloads it from
# HuggingFace on first use. It is NOT vendored, and this workflow does not
# pretend otherwise. First run downloads it; later runs hit the cache. A
# transient network failure must not be reported as a test failure, so the
# download is retried, in its own step, BEFORE any test runs. The tests
# themselves still run exactly once, with no retry: retrying a download is
# resilience, retrying a test is hiding a defect.
#
# No matrix across Python versions: the project declares `requires-python =
# ">=3.10"` and 3.10 is what the venv runs. A version matrix here would triple
# the runtime to re-test a range nobody claims to support.
#
# WHAT IS DELIBERATELY NOT HERE
# -----------------------------
# No `continue-on-error` on a real step, no deselect, no `|| true`, and no
# retry on a test. A step that can fail must be allowed to. The one step that
# cannot fail (the wiki index) has nothing in it that can, and says so in its
# own output.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 3.10 matches the local venv exactly, so "green here" and "green on my
      # machine" mean the same thing. setup-python also puts this
      # interpreter first on PATH, which is the trap-2 fix.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            pyproject.toml

      # Pinned rather than inherited: ubuntu-latest ships whatever Node it
      # ships, and "the Node suite passed" should not depend on a runner image
      # detail. Nothing in tests/frontend/*.test.mjs needs a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          # Declared runtime.
          pip install -r backend/requirements.txt

          # Declared test runner: the `dev` extra from pyproject.toml, installed
          # as the project declares it rather than hand-listed here. This line
          # used to be
          #     pip install "pytest>=7.4.0" "pytest-asyncio>=0.21.0" "httpx>=0.28.0"
          # which is a hand-written COPY of part of that extra, and a copy is
          # not a declaration. It could only ever describe the day it was
          # written: adding a dev dependency, or moving a floor, left CI
          # installing the old set, and the environment the packaging guard was
          # exercised in stopped being the one the project describes.
          #
          # It also happened to be green by coincidence. `tomli` -- which
          # tests/test_packaging.py needs on 3.10, where tomllib is not stdlib,
          # and which pyproject.toml therefore declares in this extra -- was
          # NOT installed by that hand-written line. It arrived only as a
          # transitive of pytest>=7.4.0 resolving to pytest 9.x, whose own
          # metadata says `tomli>=1; python_version < "3.11"`. That is exactly
          # the failure mode tests/test_packaging.py was written to stop
          # trusting: a dependency that is present by accident, and vanishes the
          # day upstream re-extras it. Nothing here pins pytest to a major
          # version, so nothing would have failed loudly first.
          #
          # -e, not a plain install: a plain install would copy `backend` into
          # site-packages, giving the suite a second copy of the code to import
          # and making "which copy did the test run against" a path-ordering
          # accident. Editable points at the checkout, so the suite can only
          # ever test the tree that was committed.
          #
          # pytest-asyncio is not optional in that extra: pyproject.toml sets
          # asyncio_mode = "auto", and without the plugin the async tests are
          # not collected correctly (see trap 1 in the header).
          pip install -e ".[dev]"

          # There is deliberately no `pip install "pyyaml>=6.0"
          # "scikit-learn>=1.3"` line here any more. It used to be here, and it
          # was papering over an undeclared-dependency defect that has since
          # been fixed properly in the manifests:
          #
          #   pyyaml        backend/services/rag.py:14  (module level)
          #   scikit-learn  backend/services/rag.py:421 (TF-IDF fallback)
          #   starlette     backend/middleware.py:13    (module level)
          #
          # All three are now declared in backend/requirements.txt AND
          # pyproject.toml, at the exact floors an already-mandatory dependency
          # imposes, so the resolved install is unchanged (76 packages before
          # and after -- verified, not assumed).
          #
          # A correction to the comment that used to sit here, because the
          # wrong diagnosis is more expensive than the defect was: it claimed
          # that "a clean `pip install -r backend/requirements.txt` cannot
          # import backend.services.rag at all". That is FALSE, and it was never
          # true. All three arrived as hard, non-extra transitives --
          # pyyaml via ctranslate2 (from faster-whisper) and via transformers,
          # scikit-learn via sentence-transformers, starlette via fastapi -- so a
          # clean install imported the module fine and the suite passed. That is
          # exactly what made this worth fixing rather than ignoring: the
          # dependency was installed by coincidence, so the day any of those
          # three packages re-extras or drops that edge, the app stops starting
          # on a machine where CI was green the day before.
          #
          # If you ever need to see the failure for yourself, suppress the
          # transitives rather than waiting for an upstream release to do it:
          #   pip install --no-deps -r backend/requirements.txt
          # Reproduces `ModuleNotFoundError: No module named 'yaml'` at
          # backend/services/rag.py:14. tests/test_packaging.py asserts the
          # declarations exist, so the omission cannot come back silently.

      # NOT a build prerequisite. The corpus the suite retrieves over is
      # tests/fixtures/retrieval_corpus/ and it is committed in full,
      # index.md included, so nothing has to be generated for pytest to run.
      # (Do not repoint this at the fixture: running the generator over
      # tests/fixtures/retrieval_corpus/ rewrites that committed index.md --
      # verified, 48 insertions / 39 deletions -- because the committed index
      # is a deliberately partial page set, not generator output, and
      # tests/test_candidate.py:179 asserts on its contents.)
      #
      # The owner's real wiki/ is private, is out of this repository, and is
      # not this job's business. The branch below exists only for a fork that
      # genuinely tracks its own wiki/, where the generator still runs and can
      # still fail. When it is absent -- the canonical case -- that is announced
      # with a ::notice:: annotation, so "absent by design" is visible in the
      # run summary rather than silent. It is not a suppressed failure: there
      # is no work here that can fail, and the generator itself is covered by
      # tests/test_wiki_generate_index.py in the Python suite below.
      - name: Wiki index (owner's private corpus, not a build prerequisite)
        run: |
          if [ -d wiki ]; then
            echo "wiki/ is tracked in this checkout; generating its index."
            python scripts/wiki/generate_index.py --wiki wiki
          else
            echo "::notice::No wiki/ in this checkout. Expected: the owner's wiki is private and is not in this repository. The retrieval corpus is tests/fixtures/retrieval_corpus/ (committed), and this job does not validate the owner's personal content."
          fi

      - name: Cache the sentence-transformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: >-
            ${{ runner.os }}-minilm-l6-v2-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-minilm-l6-v2-

      - name: Pre-fetch the embedding model
        run: |
          for attempt in 1 2 3; do
            if python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"; then
              echo "model ready"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "could not download all-MiniLM-L6-v2 after 3 attempts"
              exit 1
            fi
            echo "model download failed (attempt $attempt); retrying in 10s"
            sleep 10
          done

      - name: Python suite
        # Canonical local form. `PYTEST_DISABLE_PLUGIN_AUTOLOAD` must stay
        # unset here -- see the trap-1 note in the header.
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Node frontend suites
        # Run separately from pytest on purpose. These suites are also wired
        # into pytest via NODE_TESTS, so a Node failure could otherwise be
        # reported as a Python failure and read as a harness problem. No
        # retry: test_cleanup_custom_days_override is a real test now, and if
        # it ever fails that is information.
        run: node --test "tests/frontend/*.test.mjs"
