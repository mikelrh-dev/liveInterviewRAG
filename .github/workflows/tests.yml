name: tests

# What this workflow guarantees, and what it does not.
#
# GUARANTEES: that both test suites run on every push and pull request, and
# that a real failure in either is reported as a failure. It runs the exact
# commands that are canonical locally, so a green run here means a green run
# on a developer machine.
#
# It also guarantees the dependency manifests stay honest, which it could not
# do before: tests/test_packaging.py fails the build if backend/ imports a
# distribution that neither backend/requirements.txt nor pyproject.toml
# declares, or if those two files disagree on any distribution or floor. That
# test is why the "install the undeclared packages by hand" step is gone, and
# why it cannot be reintroduced quietly -- a hand-written pip line is not a
# declaration, and adding one here is what hid this class of bug. The remaining
# hand-written line was the dev extra itself, which is now installed from the
# declaration instead; see that step for what was wrong with it.
#
# WHAT CI DOES NOT ESTABLISH
# --------------------------
# It does not check that the owner's personal content is CORRECT, and it cannot:
# "the pipeline retrieves the right page for this question" is a statement about
# retrieval, not about whether the page is a good answer to a human being.
#
# It does measure the real `wiki/`, and this section used to say the opposite.
# It claimed the wiki "is private, is not in this repository, and is not this
# project's business", and that the corpus the suite retrieves over was
# `tests/fixtures/retrieval_corpus/` -- 42 invented pages. Both were false:
# `git ls-files wiki` returns 46 files, they are in `origin/main`, and
# `actions/checkout` brings them here. Worse, the stand-in was a structural
# clone of the real wiki -- same directories, 13 identical filenames, 9 of 11
# FAQ slugs byte-identical -- whose pages were more findable than the real
# ones (recall@3 0.776 against 0.653). So a retrieval guard had been reading a
# copy of the thing it was supposed to be measuring, and its floor was rejecting
# the better chunker while the real corpus went unconsulted.
#
# The retrieval guard now runs on the real corpus, in this job, over the 49
# questions that were authored against those pages. It refuses to run without
# them and FAILS when it cannot, so this job goes red rather than green on a
# checkout where the corpus is gone. That is deliberate: a green run that
# measured nothing is the defect being fixed, and a skip cannot be made loud
# enough to prevent it from being read as a pass.
#
# THERE IS NO KNOWN FAILURE ON THIS PLATFORM
# -------------------------------------------
# There used to be one, and this file used to say so. `test_config_paths`
# asserted that the checkout directory is named "InterviewTTS". It is not, and
# has not been for a while: `actions/checkout` names the workspace after the
# REPOSITORY, and the remote is `mikelrh-dev/liveInterviewRAG`, so that
# assertion failed here and passed only on the author's machine.
#
# The test now asserts what is actually a property of the code -- that BASE_DIR
# is the repository root and that CANDIDATE_DIR / AUDIO_DIR / FRONTEND_DIR are
# fixed names directly inside it -- and it asserts it by construction, so it
# holds in a directory called InterviewTTS, one called liveInterviewRAG, and one
# called anything else. That was verified, not assumed: the suite was run in a
# copy of this repository at a path ending in `liveInterviewRAG` and at one
# ending in `InterviewTTS`, and both are green; and both real misconfigurations
# (CANDIDATE_DIR renamed, BASE_DIR anchored one level too low) were introduced
# in that copy to confirm the test still fails when the code is actually wrong.
#
# Nothing here is skipped or xfailed to get a green build. A test that encoded a
# real constraint was corrected, not muted.
#
# TWO ENVIRONMENT TRAPS THIS REPRODUCES ON PURPOSE
# ------------------------------------------------
# 1. `PYTEST_DISABLE_PLUGIN_AUTOLOAD` is NOT set. With it set, pytest-asyncio
#    is never auto-loaded and 8 async tests fail with a misleading
#    "async def functions are not natively supported" error. There is no
#    `-p no:cacheprovider`-style fix; the variable simply must stay unset, so
#    it is called out here rather than left to be re-introduced.
# 2. The interpreter is the one `actions/setup-python` provisioned, and it is
#    the one that received the dependencies below. Running `pytest` from a
#    different interpreter — a system python, a sibling venv — produces
#    "No module named pydantic" and looks like a dependency bug.
#
# MODEL DOWNLOAD
# --------------
# The RAG embeds with `paraphrase-multilingual-MiniLM-L12-v2` (~457 MB) and
# downloads it from HuggingFace on first use. It is NOT vendored, and this
# workflow does not pretend otherwise. First run downloads it; later runs hit
# the cache. A transient network failure must not be reported as a test
# failure, so the download is retried, in its own step, BEFORE any test runs.
# The tests themselves still run exactly once, with no retry: retrying a
# download is resilience, retrying a test is hiding a defect.
#
# The deployed unit makes the same download, which is why
# deployment/interviewtts.service lists the HuggingFace cache in ReadWritePaths:
# a cache that is not writable is a 457 MB download at every restart.
#
# No matrix across Python versions: the project declares `requires-python =
# ">=3.10"` and 3.10 is what the venv runs. A version matrix here would triple
# the runtime to re-test a range nobody claims to support.
#
# WHAT IS DELIBERATELY NOT HERE
# -----------------------------
# No `continue-on-error` on a real step, no deselect, no `|| true`, and no
# retry on a test. A step that can fail must be allowed to. The one step that
# cannot fail (the wiki index) has nothing in it that can, and says so in its
# own output.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 3.10 matches the local venv exactly, so "green here" and "green on my
      # machine" mean the same thing. setup-python also puts this
      # interpreter first on PATH, which is the trap-2 fix.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            pyproject.toml

      # Pinned rather than inherited: ubuntu-latest ships whatever Node it
      # ships, and "the Node suite passed" should not depend on a runner image
      # detail. Nothing in tests/frontend/*.test.mjs needs a build step.
      #
      # 22, and the floor is the test runner, not the framework. `node --test`
      # did not accept a glob in its positional arguments until Node 21
      # (nodejs/node#50658: "Glob support for the test runner is unfortunately
      # not part of Node.js 20"). This step runs
      # `node --test "tests/frontend/*.test.mjs"`, so on the Node 20 that used to
      # be pinned here the quoted glob was taken as a literal path and the step
      # died with "Could not find 'tests/frontend/*.test.mjs'". It worked on the
      # author's machine only because that machine runs 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci
        # The frontend suites need a DOM. tests/frontend/dom.mjs parses the
        # shipped index.html with jsdom and evaluates the real app.js functions
        # inside it, which is what let the XSS suite load the real escapeHtml
        # instead of a stub it wrote itself -- replacing the shipped
        # escapeHtml with `return String(text)` used to leave the suite green.
        #
        # This step is not optional. Without it every suite that touches the DOM
        # fails on `Cannot find package 'jsdom'`, and the failure reads as a
        # harness problem rather than a missing install.
        #
        # jsdom is pinned exactly in package.json (26.1.0, `engines: {node:
        # ">=18"}`). The pin is what matters now, not the version: an exact
        # version cannot drift under a fresh `npm ci`, and neither can its
        # transitive tree. The Node floor for this job is set by the test runner
        # above, not by jsdom.

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          # Declared runtime.
          pip install -r backend/requirements.txt

          # Declared test runner: the `dev` extra from pyproject.toml, installed
          # as the project declares it rather than hand-listed here. This line
          # used to be
          #     pip install "pytest>=7.4.0" "pytest-asyncio>=0.21.0" "httpx>=0.28.0"
          # which is a hand-written COPY of part of that extra, and a copy is
          # not a declaration. It could only ever describe the day it was
          # written: adding a dev dependency, or moving a floor, left CI
          # installing the old set, and the environment the packaging guard was
          # exercised in stopped being the one the project describes.
          #
          # It also happened to be green by coincidence. `tomli` -- which
          # tests/test_packaging.py needs on 3.10, where tomllib is not stdlib,
          # and which pyproject.toml therefore declares in this extra -- was
          # NOT installed by that hand-written line. It arrived only as a
          # transitive of pytest>=7.4.0 resolving to pytest 9.x, whose own
          # metadata says `tomli>=1; python_version < "3.11"`. That is exactly
          # the failure mode tests/test_packaging.py was written to stop
          # trusting: a dependency that is present by accident, and vanishes the
          # day upstream re-extras it. Nothing here pins pytest to a major
          # version, so nothing would have failed loudly first.
          #
          # -e, not a plain install: a plain install would copy `backend` into
          # site-packages, giving the suite a second copy of the code to import
          # and making "which copy did the test run against" a path-ordering
          # accident. Editable points at the checkout, so the suite can only
          # ever test the tree that was committed.
          #
          # pytest-asyncio is not optional in that extra: pyproject.toml sets
          # asyncio_mode = "auto", and without the plugin the async tests are
          # not collected correctly (see trap 1 in the header).
          pip install -e ".[dev]"

          # There is deliberately no `pip install "pyyaml>=6.0"
          # "scikit-learn>=1.3"` line here any more. It used to be here, and it
          # was papering over an undeclared-dependency defect that has since
          # been fixed properly in the manifests:
          #
          #   pyyaml        backend/services/rag.py:14  (module level)
          #   scikit-learn  backend/services/rag.py:677 (TF-IDF fallback)
          #   starlette     backend/middleware.py:13    (module level)
          #
          # All three are now declared in backend/requirements.txt AND
          # pyproject.toml, at the exact floors an already-mandatory dependency
          # imposes, so the resolved install is unchanged (76 packages before
          # and after -- verified, not assumed).
          #
          # A correction to the comment that used to sit here, because the
          # wrong diagnosis is more expensive than the defect was: it claimed
          # that "a clean `pip install -r backend/requirements.txt` cannot
          # import backend.services.rag at all". That is FALSE, and it was never
          # true. All three arrived as hard, non-extra transitives --
          # pyyaml via ctranslate2 (from faster-whisper) and via transformers,
          # scikit-learn via sentence-transformers, starlette via fastapi -- so a
          # clean install imported the module fine and the suite passed. That is
          # exactly what made this worth fixing rather than ignoring: the
          # dependency was installed by coincidence, so the day any of those
          # three packages re-extras or drops that edge, the app stops starting
          # on a machine where CI was green the day before.
          #
          # If you ever need to see the failure for yourself, suppress the
          # transitives rather than waiting for an upstream release to do it:
          #   pip install --no-deps -r backend/requirements.txt
          # Reproduces `ModuleNotFoundError: No module named 'yaml'` at
          # backend/services/rag.py:14. tests/test_packaging.py asserts the
          # declarations exist, so the omission cannot come back silently.

      # NOT a build prerequisite, and the reason is now factual rather than
      # convenient. `wiki/` is 46 TRACKED files: actions/checkout brings them
      # here, and the retrieval guard below measures the real corpus. The
      # generator is not run over it because `index.md` is a build artifact the
      # loader deliberately skips, and pytest never needs it.
      #
      # The step runs anyway, and its absence branch now means something real.
      # If `wiki/` is ever untracked or removed -- the owner has a known open
      # issue about this dossier being on a public remote and has deferred it --
      # the Python suite in this same job will FAIL in
      # TestTheRetrievalGuardActuallyRan rather than skip quietly, so this
      # branch is a courtesy annotation and not the signal. Do not rely on it.
      - name: Wiki index (not a build prerequisite; the guard needs the corpus)
        run: |
          if [ -d wiki ]; then
            echo "wiki/ is tracked in this checkout; generating its index."
            python scripts/wiki/generate_index.py --wiki wiki
          else
            echo "::error::No wiki/ in this checkout. The 46 wiki files are tracked, so the retrieval guard in tests/test_rag.py cannot measure anything and this job's Python step will fail. This is not a suppressed failure."
          fi

      - name: Cache the sentence-transformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: >-
            ${{ runner.os }}-minilm-l12-paraphrase-multilingual-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-minilm-l12-paraphrase-multilingual-

      - name: Pre-fetch the embedding model
        # The model is whatever backend/config.py's EMBEDDING_MODEL defaults to,
        # which is paraphrase-multilingual-MiniLM-L12-v2 (~457 MB). This step used
        # to pre-fetch all-MiniLM-L6-v2, the previous English-only default: it
        # warmed a cache key nothing read, and the suite then downloaded the real
        # 457 MB model itself, uncached, after this step had already claimed to
        # have handled the download. Read the value out of config.py rather than
        # repeating it here, so the two cannot drift again.
        run: |
          model="$(python -c 'from backend.config import config; print(config.EMBEDDING_MODEL)')"
          echo "pre-fetching $model"
          for attempt in 1 2 3; do
            if python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('$model')"; then
              echo "model ready: $model"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "could not download $model after 3 attempts"
              exit 1
            fi
            echo "model download failed (attempt $attempt); retrying in 10s"
            sleep 10
          done

      - name: Python suite
        # Canonical local form. `PYTEST_DISABLE_PLUGIN_AUTOLOAD` must stay
        # unset here -- see the trap-1 note in the header.
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Node frontend suites
        # Run separately from pytest on purpose. These suites are also wired
        # into pytest via NODE_TESTS, so a Node failure could otherwise be
        # reported as a Python failure and read as a harness problem. No
        # retry: test_cleanup_custom_days_override is a real test now, and if
        # it ever fails that is information.
        #
        # THE FLOOR BELOW IS NOT OPTIONAL. Fixing the Node pin above is what
        # makes this step able to run at all; it is also what makes it able to
        # pass without running a single test. Since Node 21, a glob with magic
        # characters that matches nothing is not an error -- it is an empty file
        # list:
        #
        #   $ node --test "tests/frontend/nope-*.test.mjs"; echo "exit $?"
        #   # tests 0
        #   # pass 0
        #   exit 0
        #
        # (A literal path that does not exist still fails, with "Could not
        # find". It is specifically a *glob* that matches nothing that is
        # silent.) So if tests/frontend/ is ever renamed, moved, or emptied,
        # this step goes green having verified nothing -- strictly worse than
        # the hard failure it replaced, because it looks like a pass.
        #
        # So the count of tests node reports is asserted, against the count of
        # test files that exist. The floor is derived from the tree rather than
        # pinned to 263, which means it cannot go stale: every file on disk
        # must have contributed at least one test, and no file may be missing.
        # The exact total is pinned where it belongs, in
        # tests/test_readme_test_counts.py::NODE_TESTS, regenerated with the
        # same command.
        run: |
          set -euo pipefail

          node --test --test-reporter=tap "tests/frontend/*.test.mjs" | tee node-test.tap

          node -e '
            const fs = require("node:fs");
            const tap = fs.readFileSync("node-test.tap", "utf8");
            const ran = Number(/^# tests (\d+)$/m.exec(tap)?.[1] ?? NaN);
            const files = fs
              .readdirSync("tests/frontend")
              .filter((name) => name.endsWith(".test.mjs")).length;

            if (!files) {
              throw new Error(
                "tests/frontend holds no *.test.mjs file. The glob matched " +
                "nothing, and node --test exits 0 in that case, so this step " +
                "would pass without running a single test."
              );
            }
            if (!(ran >= files)) {
              throw new Error(
                `node --test reported ${ran} tests across ${files} files under ` +
                "tests/frontend. The glob did not expand, and node --test exits " +
                "0 when a glob matches nothing, so this step would pass without " +
                "running a single test."
              );
            }
            console.log(`OK: ${ran} tests across ${files} files.`);
          '

          rm -f node-test.tap
