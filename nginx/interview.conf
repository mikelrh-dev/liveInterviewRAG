# ─────────────────────────────────────────────────────────────────────────────
# InterviewTTS — nginx site configuration
#
# DEPLOYMENT ORDER — DO NOT SKIP
#
#   1. Install the certificate FIRST, on the VPS:
#          certbot certonly --standalone -d <your-domain>
#      This writes the files referenced by ssl_certificate below. Reloading
#      nginx before the certificate exists makes it refuse to start.
#
#   2. `nginx -t && systemctl reload nginx` and confirm https://<domain> serves
#      the app correctly, including /api/ and /audio/.
#
#   3. ONLY THEN enable the port-80 redirect below (uncomment the `return 301`
#      in the first server block). It is shipped commented out on purpose:
#      enabling it while TLS is broken locks every visitor out, including
#      your own, and the plain-http site becomes unreachable.
#
#   Reverting step 3 is easy; reverting a browser's cached HSTS decision after
#   clients have seen the header is not.
# ─────────────────────────────────────────────────────────────────────────────

server {
    # Plain HTTP. Redirect only — no content is served here.
    listen 80;
    server_name _;

    # Uncomment only after the 443 server block below is confirmed working.
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Let's Encrypt live certificate paths (populated by `certbot`).
    ssl_certificate     /etc/letsencrypt/live/interviewtts/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interviewtts/privkey.pem;

    # TLS policy
    ssl_protocols TLSv1.2 TLSv1.3;
    # Modern clients negotiate their own cipher preference; forcing the
    # server order tends to select worse ciphers on older stacks.
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Frontend static files
    location / {
        root /opt/interviewtts/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy to FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio file serving
        proxy_buffering off;
        proxy_cache off;
    }

    # Audio files (generated by TTS)
    location /audio/ {
        alias /opt/interviewtts/audio/;
        expires 1h;
        add_header Cache-Control "public, immutable";

        # nginx does NOT inherit parent add_header directives into a block
        # that declares its own, so the server-level headers below would be
        # dropped here without repeating them. HSTS in particular must reach
        # every response for it to be worth setting at all.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # HSTS — tell browsers to refuse plain HTTP for a year.
    # WARNING: this is effectively irreversible for returning clients. Once a
    # browser has cached it, it will refuse http:// for this host even if TLS
    # is later broken, and the only remedy is `max-age=0` plus waiting out
    # the cache. Add it only after HTTPS is confirmed working for EVERY client
    # that needs access, and consider starting with a short max-age (e.g. 300)
    # to validate before committing to a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
