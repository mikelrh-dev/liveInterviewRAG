# ─────────────────────────────────────────────────────────────────────────────
# InterviewTTS — nginx site configuration
#
# DEPLOYMENT ORDER — DO NOT SKIP. Each step is executable in the order given.
#
#   1. Obtain the certificate, on the VPS, with nginx NOT yet listening on
#      port 80:
#
#         certbot certonly --standalone --cert-name interviewtts -d <your-domain>
#
#      --standalone binds port 80 itself to answer the ACME challenge, so it
#      fails with "Address already in use" if anything is already listening
#      there. On a fresh VPS nothing is; if nginx is installed and running,
#      stop it first (`systemctl stop nginx`) and start it again in step 2.
#      The webroot plugin is the alternative, but it needs a live HTTP server
#      for this config to be useful, and this config cannot start without a
#      certificate -- so it is the wrong tool here, not a free one.
#
#      --cert-name is what makes this step and the ssl_certificate lines below
#      agree, and it is the whole reason this step is not cosmetic. certbot
#      derives the output directory from the FIRST -d when --cert-name is
#      absent, so the plain form writes:
#
#          /etc/letsencrypt/live/<your-domain>/fullchain.pem
#
#      which is a different path from the one this file points at, and nginx
#      then refuses to start with "cannot load certificate". Naming the
#      certificate `interviewtts` decouples the directory from the domain, so
#      the config below is correct for every domain and stays correct when the
#      domain changes:
#
#          /etc/letsencrypt/live/interviewtts/fullchain.pem
#
#      Verify before going on: `ls /etc/letsencrypt/live/interviewtts/`.
#      `certbot renew` re-issues to the same path, so nothing below has to
#      change when it does.
#
#   2. Install this file, then start nginx for the first time:
#
#         cp nginx/interview.conf /etc/nginx/sites-available/interviewtts
#         ln -s /etc/nginx/sites-available/interviewtts \
#               /etc/nginx/sites-enabled/interviewtts
#         nginx -t && systemctl enable --now nginx
#
#      `enable --now`, not `reload`: a fresh install has nginx disabled and
#      not running, and `systemctl reload` on a stopped unit does not start it.
#      Confirm https://<your-domain> serves the app, including /api/ and
#      /audio/, before touching step 3.
#
#   3. ONLY THEN enable the port-80 redirect below (uncomment the `return 301`
#      in the first server block). It is shipped commented out on purpose:
#      enabling it while TLS is broken locks every visitor out, including
#      your own, and the plain-http site becomes unreachable.
#
#   Reverting step 3 is easy; reverting a browser's cached HSTS decision after
#   clients have seen the header is not.
# ─────────────────────────────────────────────────────────────────────────────

server {
    # Plain HTTP. Redirect only — no content is served here.
    listen 80;
    server_name _;

    # Uncomment only after the 443 server block below is confirmed working.
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Let's Encrypt live certificate paths (populated by `certbot`).
    ssl_certificate     /etc/letsencrypt/live/interviewtts/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interviewtts/privkey.pem;

    # TLS policy
    ssl_protocols TLSv1.2 TLSv1.3;
    # Modern clients negotiate their own cipher preference; forcing the
    # server order tends to select worse ciphers on older stacks.
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Frontend static files
    location / {
        root /opt/interviewtts/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy to FastAPI
    location /api/ {
        # Request body ceiling. MUST track MAX_AUDIO_SIZE in backend/uploads.py
        # -- and must EXCEED it, not merely equal it. See below.
        #
        # nginx defaults this to 1 MB when it is absent, and the application
        # accepts 5 MB. Those two layers do not negotiate: the outer one runs
        # first and wins outright, so a 1-5 MB recording is rejected by nginx
        # with a bare 413 before FastAPI ever sees it. The application cannot
        # explain that failure, because from its point of view nothing was ever
        # submitted -- and nothing in the Python suite catches it either, since
        # the application's own ceiling is correct and simply never consulted.
        #
        # Setting the value explicitly is the only way to keep the two in
        # agreement. tests/test_nginx_config.py parses this file and compares it
        # against the constant, so the two layers cannot drift apart unnoticed.
        #
        # WHY EQUAL IS NOT ENOUGH -- THE MULTIPART ENVELOPE
        # MAX_AUDIO_SIZE bounds the AUDIO FILE. What arrives here is the
        # multipart/form-data BODY that carries it: boundary delimiters, a
        # Content-Disposition header per part, the filename, and whatever other
        # fields the client sends alongside the recording. A 5 MB file inside
        # that envelope is a body LARGER than 5 MB, so `client_max_body_size
        # 5m` rejects the exact maximum the application accepts -- the largest
        # legitimate upload is the one that fails, and it fails with a bare 413
        # that names neither layer.
        #
        # 6m leaves 1 MiB of headroom over MAX_AUDIO_SIZE for that envelope and
        # for a future non-audio field. The test requires at least 256 KiB, which
        # is already ~200x a realistic envelope, so the margin cannot be spent
        # by accident.
        client_max_body_size 6m;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Response-window ceiling. MUST track backend.sse.SSE_KEEPALIVE_INTERVAL_SECONDS.
        #
        # nginx applies a 60s proxy_read_timeout when the directive is absent,
        # and the window it bounds is the gap between two successive reads from
        # the upstream -- not the total response time. /message/stream sends its
        # first byte only after Whisper finishes (backend/turns/streaming.py
        # yields `transcription` after the transcription await), so with the
        # shipped WHISPER_MODEL=small on WHISPER_DEVICE=cpu, a slow
        # transcription sits at zero bytes long enough to be cut. nginx then
        # closes the connection, the browser's reader.read() rejects, and the
        # client shows "Entrevista finalizada" with the turn half-answered.
        #
        # This paragraph used to justify itself on a thirty-second recording
        # limit. No such limit exists: no code enforces a recording duration,
        # and backend/uploads.py bounds a recording in BYTES (MAX_AUDIO_SIZE).
        # The stall that matters here is transcription, which is bounded by the
        # recording that reached Whisper and by the model, not by a duration
        # rule. The argument above stands on its own; the number it borrowed
        # from did not exist.
        #
        # This is the ceiling, not the fix. backend/sse.py emits a comment
        # keepalive every 15s through any stall, which is what actually holds
        # the connection open; this value only decides how long a stall has to
        # be before the keepalive itself stops helping. 300s holds twenty
        # intervals. The two are asserted against each other in
        # tests/test_sse_keepalive.py, so neither can be changed alone.
        #
        # proxy_send_timeout is deliberately NOT raised: it bounds the gap
        # between writes TO the upstream, and a 5MB body is written to a
        # loopback socket faster than any value that would matter. Raising it
        # would buy a timeout for a failure that cannot happen here.
        proxy_read_timeout 300s;

        # Audio file serving
        proxy_buffering off;
        proxy_cache off;
    }

    # Audio files (generated by TTS)
    location /audio/ {
        alias /opt/interviewtts/audio/;
        expires 1h;
        add_header Cache-Control "public, immutable";

        # nginx does NOT inherit parent add_header directives into a block
        # that declares its own, so the server-level headers below would be
        # dropped here without repeating them. HSTS in particular must reach
        # every response for it to be worth setting at all.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # HSTS — tell browsers to refuse plain HTTP for a year.
    # WARNING: this is effectively irreversible for returning clients. Once a
    # browser has cached it, it will refuse http:// for this host even if TLS
    # is later broken, and the only remedy is `max-age=0` plus waiting out
    # the cache. Add it only after HTTPS is confirmed working for EVERY client
    # that needs access, and consider starting with a short max-age (e.g. 300)
    # to validate before committing to a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
