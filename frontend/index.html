<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikel — Gemelo Digital</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Mikel — Gemelo Digital</h1>
            <p class="subtitle">Desarrollador Junior DAM | Entrevista por Voz</p>
        </header>

        <div class="conversation-area" id="conversation">
            <div class="message system">
                <p>Haz clic en el micrófono para empezar una entrevista por voz con el gemelo digital de Mikel.</p>
            </div>
        </div>

        <div class="controls">
            <button class="mic-button" id="micButton" title="Hold to speak">
                <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
                <svg class="stop-icon hidden" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="6" width="12" height="12" rx="1"/>
                </svg>
            </button>
            <div class="status" id="status">Ready to listen</div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
