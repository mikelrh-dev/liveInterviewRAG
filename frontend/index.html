<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikel — Gemelo Digital</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Mikel — Gemelo Digital</h1>
            <p class="subtitle">Desarrollador Junior DAM | Entrevista por Voz</p>
        </header>

        <div class="conversation-area" id="conversation">
            <div class="message system">
                <p>Haz clic en el micrófono para empezar una entrevista por voz con el gemelo digital de Mikel.</p>
            </div>
        </div>

        <div class="controls">
            <button class="btn-interview" id="btnInterview">
                <svg class="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                <svg class="stop-icon hidden" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="6" width="12" height="12" rx="1"/>
                </svg>
                <span id="btnLabel">Iniciar entrevista</span>
            </button>
            <div class="status" id="status">Preparado para escuchar</div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
